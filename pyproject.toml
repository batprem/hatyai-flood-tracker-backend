[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Hat Yai flood warning app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eccodes>=2.47.0",
    "fastapi",
    "httpx>=0.28.1",
    "motor>=3.6.0",
    "py-vapid>=1.9.0",
    "pydantic-settings",
    "pywebpush>=2.0.0",
    "shapely>=2.0.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.34",
    "pydoclint>=0.8.4",
    "pytest>=9.0.3",
    "ruff",
    "ty>=0.0.37",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pydoclint]
style = "google"
require-return-section-when-returning-nothing = false
check-return-types = false
check-class-attributes = false
arg-type-hints-in-docstring = false
