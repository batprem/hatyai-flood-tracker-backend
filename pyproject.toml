[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Hat Yai flood warning app."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
