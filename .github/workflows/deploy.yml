name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1020107859765/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: hatyai-cicd@dulcet-timing-340616.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy hatyai-flood-backend \
            --source . \
            --region asia-southeast1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "HFT_FORECAST_REPOSITORY_BACKEND=mongo,HFT_MONGODB_URI=${{ secrets.MONGODB_URI }},HFT_MONGODB_DATABASE=main,HFT_CORS_ORIGIN_REGEX=https://.*\\.run\\.app,HFT_FRONTEND_ORIGIN=https://hatyai-flood-frontend-1020107859765.asia-southeast1.run.app" \
            --project dulcet-timing-340616 \
            --quiet
